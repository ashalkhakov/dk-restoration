//
// KEY BINDINGS
//

unbindall

//
// weapons; the quick-use belt (g_inventory.c): what is on keys 1 to 9 and 0,
// put there by pressing the key on the inventory screen
//
bind	1		"belt 1"
bind	2		"belt 2"
bind	3		"belt 3"
bind	4		"belt 4"
bind	5		"belt 5"
bind	6		"belt 6"
bind	7		"belt 7"
bind	8		"belt 8"
bind	9		"belt 9"
bind	0		"belt 0"
bind	-		"sizedown"
bind	_		"sizedown"
bind	=		"sizeup"
bind	+		"sizeup"

bind    [           weapprev
bind    ]           weapnext
bind	/			weapnext
bind	\			weapongrabbed
bind	ENTER		+button2

bind	mwheelup	weapprev
bind	mwheeldown	weapnext

//
// CHARACTER CONTROLS
//

bind    CTRL		+attack
bind    r			+reload		// Doom 3's reload
bind    e			+use		// take what's looked at, use it; take hold of a ladder, let go (Daikatana's use)
bind    i			inventory	// the player's screen (ui_quests.c): its inventory tab (ui/dk_inventory.menu)
bind    j			quests		// its quests tab (ui/dk_quests.menu)
bind    p			character	// its status tab (ui/dk_status.menu)
bind    h			"invquick health"	// use the best health carried

bind    ALT			+strafe
bind    SHIFT 		+speed

bind    DEL         +lookdown
bind    PGDN        +lookup
bind    END         centerview

bind	c           +movedown
bind    SPACE       +moveup 


bind    UPARROW     +forward
bind    DOWNARROW   +back
bind    LEFTARROW   +left
bind    RIGHTARROW  +right
bind    w           +forward
bind    a           +moveleft
bind    s           +back
bind    d           +moveright

//
// MOUSE OPTIONS
//

bind    \           +mlook

//
// CLIENT ENVIRONMENT COMMANDS
//

bind    PAUSE       "pause"
bind    ESCAPE      "togglemenu"
bind    ~           "toggleconsole"
bind    `           "toggleconsole"

bind    TAB         +scores

bind    F1          "vote yes"
bind	F2			"vote no"
bind	F3			"ui_teamorders"

//
//	DEVELOPER KEYS
//
//bind	F4			give all
//bind	F5			r_speeds 1
//bind	F6			r_speeds 0
//bind 	F7			r_showtris 1
//bind	F8			r_showtris 0
//bind	F9			noclip
//bind 	F10			god
bind 	F11			screenshot

			
bind    t           "messagemode"

//
// MOUSE BUTTONS
//

bind    MOUSE3      +zoom
bind    MOUSE1      +attack
bind    MOUSE2      +altattack

//
// HUD, as Daikatana's: the weapon selector stays up five seconds after a
// change of weapon (ui/dk_hud.menu), and there's no low ammo warning,
// Daikatana only plays a sound
//
// the player: Hiro, a skeletal character (def/char_hiro.def)
seta model hiro
seta headmodel hiro
seta team_model hiro
seta team_headmodel hiro

// the console as Daikatana's: its font (int_font, as Daikatana's console
// uses rather than con_font), its picture (dk/console) and no line under it
seta cg_consoleFont "fonts/dk/int_font"
seta cg_consoleFontSize 18
seta cg_consoleLine 0
seta cg_consoleShader "dk/console"

// room for debug drawing: the bots' navigation (cg_drawAAS) reads an AAS
// file into the cgame, and draws many polygons
seta vm_cgameHeapMegs 24
seta r_maxpolys 16384
seta r_maxpolyverts 65536

seta cg_weaponSelectTime	5000
seta cg_drawAmmoWarning		0
