<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Viewer</title>
<style>
	:root { --bg: #1b1d22; --panel: #24272e; --line: #3a3e48; --text: #d8dbe2; --dim: #8a90a0; --accent: #6fb3ff; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
	#app { display: flex; height: 100%; }
	#side { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
	#view { flex: 1; position: relative; min-width: 0; }
	canvas { display: block; width: 100%; height: 100%; }
	#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
	#labels span { position: absolute; font-size: 10px; color: #ffe08a; text-shadow: 0 0 2px #000, 0 0 2px #000; white-space: nowrap; transform: translate(4px, -50%); }
	#hud { position: absolute; left: 8px; bottom: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 4px; white-space: pre; }
	h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 0 6px; }
	select, input[type=range] { width: 100%; }
	select { background: #1d2026; color: var(--text); border: 1px solid var(--line); padding: 3px; border-radius: 3px; }
	label { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }
	.row { display: flex; gap: 6px; align-items: center; }
	button { background: #2f333c; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	#joints { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; font: 12px ui-monospace, Menlo, monospace; }
	#joints div { padding: 1px 6px; cursor: pointer; white-space: nowrap; }
	#joints div:hover { background: #2f333c; }
	#joints div.sel { background: #2a4a6e; }
	#info { font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: var(--dim); }
	.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 2px; }
	#err { color: #f66; }
</style>
</head>
<body>
<div id="app">
	<div id="side">
		<h2>Model</h2>
		<select id="model"></select>
		<div id="err"></div>
		<h2>Animation</h2>
		<select id="anim"></select>
		<div class="row" style="margin-top:6px">
			<button id="play">Play</button>
			<button id="prev">&lt;</button>
			<button id="next">&gt;</button>
			<span id="frameNo" style="margin-left:auto"></span>
		</div>
		<input type="range" id="frame" min="0" max="0" value="0">
		<label>speed <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1" style="flex:1"></label>
		<h2>Show</h2>
		<label><input type="checkbox" id="showMesh" checked> rigged mesh (IQM)</label>
		<label><input type="checkbox" id="showTex" checked> textured</label>
		<label><input type="checkbox" id="showErr"> error colours (vs MD3)</label>
		<label><input type="checkbox" id="showMd3" checked> <span class="key" style="background:#ff9a3c"></span> Daikatana's frame (MD3)</label>
		<label><input type="checkbox" id="sideBySide"> MD3 beside, not over</label>
		<label><input type="checkbox" id="showSkel" checked> <span class="key" style="background:#ffe08a"></span> skeleton</label>
		<label><input type="checkbox" id="showNames"> joint names</label>
		<label><input type="checkbox" id="showAF"> <span class="key" style="background:#5ee08a"></span> ragdoll bodies (AF)</label>
		<label><input type="checkbox" id="showGrid" checked> floor grid, origin axes</label>
		<label><input type="checkbox" id="lockOrigin"> camera follows the hips</label>
		<h2>Joints <span style="text-transform:none;letter-spacing:0">(click: its vertexes)</span></h2>
		<div id="joints"></div>
		<div id="info"></div>
	</div>
	<div id="view">
		<canvas id="gl"></canvas>
		<div id="labels"></div>
		<div id="hud"></div>
	</div>
</div>
<script src="/viewer/viewer.js"></script>
</body>
</html>
